});

const serviceSelect = document.getElementById("serviceFilter");
for (const s of ["access and permissions","actions","activity","api","apps","attestations","audit","auth","authorizations_and_access","batch","billing","branch protection","branches","catalog","check suites & runs","checks","ci/cd","classroom","code","code management","code spaces","code-scanning","codes-of-conduct","codespaces","comments","commit","commits","commits and activity","content management","copilot and custom properties","custom properties","dependabot","dependency-graph","deployments","deployments and environments","discussions","education and classrooms","embeddings","enterprise","environment_management","environments","follow","gists","git","github","gitignore","inference","interactions","invitations","issue","issue types","issues","label","label and milestone management","labels and milestones","licenses","licensing and compliance","lists","markdown","meta","migration","migrations","miscellaneous","node","nodes","notifications","or","organization","organization management","organization_management","organizations","orgs","package management","packages","pages","project and card management","projects","pull request management","pull requests","pull_requests","pulls","rate-limit","reactions","relay","release management","releases","repos","repositories","repository","repository management","request","resource","sarif data","secret scanning","secrets","secrets management","security","security advisories","security and protection management","security-advisories","social integration","sponsors","stars","subscriptions","team management","teams","tokens & access","topic","user","user lists","user management","user-lists","user_management","users","users and access","viewer","webhooks","webhooks and deliveries","workflow","workflow and automation management","workflow management","workflows"]) {
  const opt = document.createElement("option");
  opt.value = s; opt.textContent = s + " (" + GRAPH.nodes.filter(n => n.service === s).length + ")";
  serviceSelect.appendChild(opt);
}

const searchBox = document.getElementById("search");
const hideIsolatedBox = document.getElementById("hideIsolated");

function applyFilters() {
  const service = serviceSelect.value;
  const query = searchBox.value.trim().toLowerCase();
  const hideIsolated = hideIsolatedBox.checked;

  const visibleIds = new Set();
  const updates = GRAPH.nodes.map(n => {
    let visible = true;
    if (service && n.service !== service) visible = false;
    if (query && !n.id.toLowerCase().includes(query)) visible = false;
    if (hideIsolated && !connected.has(n.id)) visible = false;
    if (visible) visibleIds.add(n.id);
    return { id: n.id, hidden: !visible };
  });
  allNodes.update(updates);

  allEdges.update(GRAPH.edges.map((e, i) => ({
    id: i, hidden: !(visibleIds.has(e.from) && visibleIds.has(e.to)),
  })));

  const shown = updates.filter(u => !u.hidden).length;
  document.getElementById("stats").textContent =
    shown + " / " + GRAPH.nodes.length + " nodes shown · " + GRAPH.edges.length + " edges total";
}

serviceSelect.addEventListener("change", applyFilters);
searchBox.addEventListener("input", applyFilters);
hideIsolatedBox.addEventListener("change", applyFilters);
applyFilters();
</script>
